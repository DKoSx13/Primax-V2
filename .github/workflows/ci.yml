name: Validate local demo
on: [push, pull_request, workflow_dispatch]
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start from source
        run: docker compose up -d --wait --wait-timeout 180
      - name: Backend unit and gateway contracts
        run: |
          docker compose --profile test run --build --rm backend-tests npm test -- --silent
          docker compose --profile test run --rm backend-tests npm run lint
          docker compose --profile test run --rm backend-tests node --test gateway/routes.test.cjs
      - name: PostgreSQL integration
        run: docker compose --profile test run --rm backend-tests
      - name: Frontend and print contracts
        run: |
          for app in Frontend_1_FuelFlow Frontend_2_PrimaxPrime Frontend_3_PrimaxControl PrintAgent; do
            (cd "$app" && npm test)
          done
      - name: OCR and public flows
        run: |
          docker compose exec -T plate-recognition python -m unittest test_ocr test_v11
          node <<'NODE'
          const { execFileSync, spawnSync } = require('node:child_process');
          try {
            // Fixtures come from this job's local demo stack, never from literals or logs.
            const compose = JSON.parse(execFileSync('docker', ['compose', 'config', '--format', 'json'], { encoding: 'utf8' }));
            const db = compose.services.postgres.environment;
            const fixtures = JSON.parse(execFileSync('docker', ['compose', 'exec', '-T', 'postgres', 'psql', '-X', '-qAt', '-v', 'ON_ERROR_STOP=1', '-U', db.POSTGRES_USER, '-d', db.POSTGRES_DB], {
              encoding: 'utf8',
              input: `BEGIN READ ONLY; SELECT json_build_object('member',(SELECT u.email FROM "User" u JOIN "Membership" m ON m."userId"=u.id ORDER BY m."createdAt" LIMIT 1),'control',(SELECT u.email FROM "User" u JOIN "UserPermissionGrant" g ON g."userId"=u.id WHERE g.permission='SYSTEM_ADMIN' AND g."revokedAt" IS NULL LIMIT 1)); COMMIT;`,
            }));
            const demo = compose.services.seed.environment;
            const result = spawnSync(process.execPath, ['tools/smoke-microservices.cjs'], {
              stdio: 'inherit',
              env: { ...process.env, DEMO_MEMBER_EMAIL: fixtures.member, DEMO_PASSWORD: demo.DEMO_PASSWORD, DEMO_CONTROL_ADMIN_EMAIL: fixtures.control, DEMO_CONTROL_ADMIN_PASSWORD: demo.DEMO_CONTROL_ADMIN_PASSWORD },
            });
            process.exit(result.status ?? 1);
          } catch {
            console.error('Unable to prepare explicit smoke fixtures for this CI demo stack');
            process.exit(1);
          }
          NODE
          node tools/audit-secrets.cjs
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - name: Stop containers and preserve volumes
        if: always()
        run: docker compose down
