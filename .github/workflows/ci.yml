name: Validate local demo
on: [push, pull_request, workflow_dispatch]
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start from source
        run: docker compose up -d --wait --wait-timeout 180
      - name: Backend unit and gateway contracts
        run: |
          docker compose --profile test run --build --rm backend-tests npm test -- --silent
          docker compose --profile test run --rm backend-tests npm run lint
          docker compose --profile test run --rm backend-tests node --test gateway/routes.test.cjs
      - name: PostgreSQL integration
        run: docker compose --profile test run --rm backend-tests
      - name: Frontend and print contracts
        run: |
          for app in Frontend_1_FuelFlow Frontend_2_PrimaxPrime Frontend_3_PrimaxControl PrintAgent; do
            (cd "$app" && npm test)
          done
      - name: OCR and public flows
        run: |
          docker compose exec -T plate-recognition python -m unittest test_ocr test_v11
          node tools/smoke-microservices.cjs
          node tools/audit-secrets.cjs
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - name: Stop containers and preserve volumes
        if: always()
        run: docker compose down
